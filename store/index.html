<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qh store</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <h1>qh store</h1>
  <div id="tabs" role="tablist">
    <button id="tab-apps" type="button" role="tab"></button>
    <button id="tab-store" type="button" role="tab"></button>
  </div>
  <input id="search" type="search">
  <span id="host" class="muted" title=""></span>
  <span id="checked" class="muted"></span>
  <button id="history-btn" type="button" class="ghost"></button>
  <button id="resources-btn" type="button" class="ghost"></button>
  <button id="recheck" type="button" class="ghost"></button>
  <button id="lang" type="button" class="ghost"></button>
</header>
<nav id="groups"></nav>
<p id="summary" class="muted" hidden></p>
<div id="toast" role="status" hidden></div>
<main id="grid"></main>
<p id="empty" hidden></p>
<dialog id="panel">
  <div class="panel-head">
    <img id="p-icon" alt="" referrerpolicy="no-referrer">
    <div>
      <h2 id="p-name"></h2>
      <p id="p-meta"></p>
    </div>
    <button id="p-close" type="button" class="ghost">✕</button>
  </div>
  <p id="p-desc"></p>
  <p id="p-notice" class="note" hidden></p>
  <p id="p-with" class="muted" hidden></p>
  <div id="p-fail" class="note" hidden></div>
  <p id="p-info" class="muted"></p>
  <div id="p-project" class="project"></div>
  <div id="p-shots" class="shots" hidden></div>
  <div id="p-links"></div>
  <table id="p-units"></table>
  <div id="p-actions"></div>
  <section id="p-section" hidden></section>
  <form id="p-form" hidden></form>
  <pre id="p-out" hidden></pre>
  <p id="p-clean" class="note" hidden></p>
</dialog>
<dialog id="resources">
  <div class="panel-head">
    <h2 id="r-title"></h2>
    <button id="r-close" type="button" class="ghost">✕</button>
  </div>
  <div id="r-body"></div>
  <pre id="r-out" hidden></pre>
</dialog>
<dialog id="history">
  <div class="panel-head">
    <h2 id="h-title"></h2>
    <button id="h-close" type="button" class="ghost">✕</button>
  </div>
  <div id="h-list"></div>
  <pre id="h-out" hidden></pre>
</dialog>
</body>
</html>
