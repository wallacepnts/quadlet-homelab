[secrets]
# Signs the session cookie. The image would generate one into settings.yml on
# first start, but that file is shipped from here and mounted read-only, so
# the key comes in as ${SEARXNG_SECRET} instead — which the defaults already
# read.
searxng-secret = rand-hex 32

[config]
# Read by the app, never written by it: the destination is inside a volume,
# so it cannot be derived from the unit the way an .env can.
config/settings.yml = %h/.config/containers/volumes/searxng/config/settings.yml

[upstream]
# Dated tags, no GitHub releases: the redirect trick finds nothing, so the
# registry's tag list is the reference.
searxng = registry:^20[0-9]{2}\.[0-9]+\.[0-9]+-[0-9a-f]+$
