[secrets]
# The server reads the account from one variable, as `user:password`.
anki-user = shell printf 'anki:%s' "$(openssl rand -hex 16)"

[login]
# One secret holds both, so the install splits it at the first `:`.
credentials = anki-user

[upstream]
# There is no official image: this one is built from the Dockerfile in Anki's own
# repository, on its own schedule, and lags Anki's releases. The registry is the
# source that knows what exists; the pattern keeps the distroless variant.
anki = registry:^[0-9]+\.[0-9]+-distroless$
