[secrets]
# The one database password: Postgres creates the account with it, and the server
# and the web interface log in with it.
zabbix-postgres-password = rand-hex 24

[upstream]
zabbix = zabbix/zabbix-docker
zabbix-server = zabbix/zabbix-docker
# Held on the major the official compose validates, not the newest Postgres.
zabbix-postgres = registry:^17\.[0-9]+-alpine$

[image]
zabbix-server = alpine-{version}
zabbix = alpine-{version}

[store]
group = Monitoring
