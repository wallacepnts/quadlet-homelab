[config]
# Read by the app, never written by it: the destination is inside a volume,
# so it cannot be derived from the unit the way an .env can.
# Without it tsdproxy starts on its own defaults and does not read the
# podman socket, so no container is published.
config/tsdproxy.yaml = %h/.config/containers/volumes/tsdproxy/config/tsdproxy.yaml
# The host's own services, Cockpit among them. Edit <host-ip> after the
# install; tsdproxy rereads this one without a restart.
config/lists.yaml = %h/.config/containers/volumes/tsdproxy/config/lists.yaml

[secrets]
# The tailnet auth key, generated in the Tailscale admin. Reusable and
# non-expiring is the most practical for a proxy that registers several nodes.
authkey = manual an auth key generated at https://login.tailscale.com/admin/settings/keys

[validate]
# Checked before the secret is stored, because a key the control plane refuses
# leaves tsdproxy healthy and publishing nothing — the failure looks like
# success everywhere except the tailnet. The value arrives on stdin.
#
# It registers a node and logs it out in the same breath, so nothing is left
# behind: measured, `tailscale logout` removes it from the tailnet entirely,
# while a node merely stopped would stay listed as offline.
authkey = shell podman run --rm -i --entrypoint /bin/sh docker.io/tailscale/tailscale:latest -c 'k=$(cat); tailscaled --tun=userspace-networking --state=mem: >/dev/null 2>&1 & sleep 4; tailscale up --authkey="$k" --hostname=qh-keycheck --accept-dns=false && tailscale logout'
