---
# Host services published on the tailnet, one entry each.
#
# `<host-ip>` is the address of THIS machine, and it has to be a real one:
# `host.containers.internal` only answers on Podman's default network, and
# tsdproxy lives on tsdproxy-net — measured, it times out from there. The
# tailscale address is the steadier choice, since it does not move with DHCP.
#
# Cockpit ships COMMENTED OUT on purpose: an entry pointing at a closed port
# publishes a name that answers 502, and most hosts do not run Cockpit.
# Uncomment it and replace `<host-ip>` if yours does.
#
# cockpit:
#   ports:
#     443/https:
#       targets:
#         - https://<host-ip>:9090
#   dashboard:
#     visible: true
#     label: Cockpit
#     icon: sh/cockpit
#
# qh-store, the app store (docs/tools.md), also COMMENTED OUT: it runs on the
# host and only answers on an address you give it. Set
#   QH_STORE_LISTEN=127.0.0.1:8484,<tailscale-ip>:8484
# in its unit (`systemctl --user edit qh-store`), then uncomment this.
#
# qh-store:
#   ports:
#     443/https:
#       targets:
#         - http://<tailscale-ip>:8484
#   dashboard:
#     visible: true
#     label: qh store
#     icon: mdi/storefront
