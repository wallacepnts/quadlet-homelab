defaultProxyProvider: default

docker:
  local:
    host: unix:///var/run/docker.sock
    targetHostname: host.docker.internal
    defaultProxyProvider: default

tailscale:
  providers:
    default:
      authKey: ""
      authKeyFile: /run/secrets/authkey
      controlUrl: https://controlplane.tailscale.com
  dataDir: /data/

http:
  hostname: 0.0.0.0
  port: 8080

adminAllowLocalhost: true
proxyAccessLog: true

log:
  level: info
  json: false

# Services that are not containers: tsdproxy discovers containers by label, and
# the host's own daemons have none. A list file covers them, and tsdproxy
# reloads it on change — only this file needs a restart.
lists:
  host:
    filename: /config/lists.yaml
    defaultProxyProvider: default
