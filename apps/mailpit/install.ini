[secrets]
# Mailpit reads user and password from one variable, as `user:password`.
mailpit-ui-auth = shell printf 'admin:%s' "$(openssl rand -hex 12)"

[login]
# One secret holds both, so the install splits it at the first `:`.
credentials = mailpit-ui-auth

[upstream]
mailpit = axllent/mailpit

[image]
mailpit = v{version}

[store]
license = MIT
docs = https://mailpit.axllent.org/docs/
group = Tools
# Images the app store shows, hosted by the project itself (https only, at most 6).
screenshots =
    https://raw.githubusercontent.com/axllent/mailpit/develop/server/ui-src/screenshot.png
