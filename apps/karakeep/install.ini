[secrets]
# Meilisearch's master key accepts no characters outside [A-Za-z0-9].
karakeep-meili-key = rand-alnum 48
karakeep-nextauth-secret = rand-base64 36

[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
karakeep-chrome = Zenika/alpine-chrome
# Pinned to the version karakeep's official docker-compose validates, not to
# Meilisearch's own upstream (docs/auto-update.md, "Why most of it is off").
karakeep-meilisearch = compose:karakeep-app/karakeep:docker/docker-compose.yml
