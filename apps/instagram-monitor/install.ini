[config]
# The web dashboard rejects requests whose Host header is not in
# WEB_DASHBOARD_ALLOWED_HOSTS. Without this seed file, every request
# through tsdproxy gets 403. The --setup wizard preserves existing
# settings when it regenerates the config.
instagram_monitor.conf = %h/.config/containers/volumes/instagram-monitor/data/instagram_monitor.conf

[upstream]
instagram-monitor = misiektoja/instagram_monitor

[store]
# Images the app store shows, hosted by the project itself (https only, at most 6).
screenshots =
    https://raw.githubusercontent.com/misiektoja/instagram_monitor/refs/heads/main/assets/instagram_monitor_web_dashboard.png
