[config]
# Read by the app, never written by it: the destination is inside a volume,
# so it cannot be derived from the unit the way an .env can.
# The storage path and the auth method. Radicale starts without it, on
# defaults that store nothing where the volume is.
config/config = %h/.config/containers/volumes/radicale/config/config
# The birthday calendar's timer. The script itself comes inside the image, at
# /usr/local/bin; only the host units land here, and they still need
# `systemctl --user enable --now radicale-birthday-sync.timer` once.
birthday-sync/radicale-birthday-sync.service = %h/.config/systemd/user/radicale-birthday-sync.service
birthday-sync/radicale-birthday-sync.timer = %h/.config/systemd/user/radicale-birthday-sync.timer

[upstream]
# The image is a rebuild of tomsquest/docker-radicale carrying the birthday
# script. Its releases are what to watch: the Radicale inside follows them,
# not the other way round.
# It publishes tags but no GitHub releases, so the redirect trick finds
# nothing — compare against the registry's tag list instead.
radicale = registry:^v[0-9]+\.[0-9]+\.[0-9]+$
