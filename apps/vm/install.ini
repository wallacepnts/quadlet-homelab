[choices.vm-chromeos]
VERSION =
    Which ChromeOS Flex channel to track
    stable: Stable — updates about every 4 weeks
    ltc: Long-Term Channel — about every 6 months
    ltr: Long-Term Release — about every 18 months
    beta: Beta — about weekly

[upstream]
# Two of the three image names differ from their GitHub repository:
# `dockurr` has two r's, and the QEMU org is `qemus` with an s.
# Without these lines `updates.py` guesses wrong and finds nothing.
vm-windows = dockur/windows
vm-windows-arm = dockur/windows-arm
vm-macos = dockur/macos
vm-qemu = qemus/qemu
vm-zima = dockur/zima
vm-chromeos = dockur/chromeos
