[secrets]
# O Laravel exige o prefixo `base64:` no APP_KEY, e exatamente 32 bytes.
monica-app-key = shell printf 'base64:%s' "$(openssl rand -base64 32)"

[store]
license = AGPL-3.0
docs = https://beta.monicahq.com
group = Personal
# monica-next, where the pinned build came from, no longer exists; the project lives here.
repo = monicahq/monica
