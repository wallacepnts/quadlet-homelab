[secrets]
# The `root` password for the Proxmox web interface. Upstream's default is the
# literal string `root`; this replaces it.
proxmox-root-password = rand-alnum 20

[upstream]
# The image is `dockurr/proxmox` (two r's), the repository is `dockur/proxmox`.
# Without this line `updates.py` guesses the image name and finds nothing.
proxmox = dockur/proxmox
