[secrets]
# Both come from Beszel's own UI, when registering the system — they are not
# generated here (see the README, agent section).
beszel-agent-key = manual the SSH public key Beszel shows when adding the system
beszel-agent-token = manual the token shown on that same Beszel screen

[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
beszel-agent = henrygd/beszel
