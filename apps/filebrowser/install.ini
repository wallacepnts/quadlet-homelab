[secrets]
# The admin account's password, read from FILEBROWSER_ADMIN_PASSWORD.
filebrowser-admin-password = rand-alnum 20
# Signs the session cookie. Changing it later logs everyone out.
filebrowser-jwt-secret = rand-hex 32

[login]
# What the install prints at the end. The username is fixed in the app and is
# not settable by environment variable — only by auth.adminUsername in the
# config. The other secret signs the session cookie and is never typed.
user = admin
password = filebrowser-admin-password

[config]
# The app looks for its config INSIDE the data directory, not where the image
# leaves its template — starting without it is a FATAL, not a warning. The
# path cannot be derived from the unit, so it is stated here.
config.yaml.example = %h/.config/containers/volumes/filebrowser/data/config.yaml

[upstream]
filebrowser = gtsteffaniak/filebrowser
