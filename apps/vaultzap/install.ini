[secrets]
# The interface password, in `user:password` form (upstream splits at the
# first `:` and refuses either side being empty). It cannot be drawn at
# random: you choose it and you will type it into the browser dialog.
#   printf 'user:strong-password' > ~/.config/containers/secrets/vaultzap/basic-auth.txt
#   chmod 600 ~/.config/containers/secrets/vaultzap/basic-auth.txt
#   podman secret create vaultzap-basic-auth ~/.config/containers/secrets/vaultzap/basic-auth.txt
vaultzap-basic-auth = manual choose `user:password` and create the secret by hand (see the README)
