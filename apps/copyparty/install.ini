[config]
# The same case as donetick: the volume is the /cfg directory.
copyparty.conf.example = %h/.config/containers/volumes/copyparty/cfg/copyparty.conf

[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
copyparty = 9001/copyparty
