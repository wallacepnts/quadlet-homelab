
[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
# The image is LinuxServer's and versions as `0.7.6-nbxyzNN`; the releases of
# netbootxyz/netboot.xyz are for the MENU (3.0.2), a different thing.
# Comparing the two is exactly the false positive rule 9 warns about.
netbootxyz = registry

[store]
license = MIT
docs = https://netboot.xyz/docs/docker
group = Network & Security
# The image is built from netbootxyz/docker-netbootxyz, but the project, and its issues, live here.
repo = netbootxyz/netboot.xyz
