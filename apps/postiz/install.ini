[config]
# Read by the image's nginx, never written: the project's nginx.conf with the
# session cookie's Domain rewritten, because Postiz sets it to `.ts.net`, a
# public suffix every browser refuses. Without it the login answers 200 and the
# session never forms.
nginx.conf = %h/.config/containers/volumes/postiz/config/nginx.conf

[secrets]
# Only Postgres reads this one by itself.
postiz-db-password = rand-hex 24
# Postiz takes the password inside a URL and nowhere else, so this one is built
# from the secret above. The order matters: it is created second, and reads the
# first back out.
postiz-database-url = shell printf 'postgresql://postiz-user:%s@postiz-postgres:5432/postiz' "$(podman secret inspect --showsecret --format '{{.SecretData}}' postiz-db-password)"
postiz-temporal-db-password = rand-hex 24
postiz-jwt-secret = rand-hex 32

[upstream]
postiz = gitroomhq/postiz-app
postiz-postgres = compose:gitroomhq/postiz-app:docker-compose.yaml
postiz-temporal = compose:gitroomhq/postiz-app:docker-compose.yaml
postiz-temporal-postgres = compose:gitroomhq/postiz-app:docker-compose.yaml
# The official compose runs Redis 7.2; this follows Valkey like the rest of the
# repository, so there is no release to compare it against.
postiz-redis = -
