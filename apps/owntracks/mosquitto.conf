listener 1883

# WebSockets — for browser/JS-based MQTT clients (the official phone app
# uses native MQTT on 1883 above and does not need this one). The same
# authentication applies (allow_anonymous/password_file below apply to every
# listener when per_listener_settings is not set).
listener 9001
protocol websockets

allow_anonymous false
# The file comes from a Quadlet Secret= (see mosquitto.container), not from
# the /mosquitto/config bind mount — do not version or mix the two.
password_file /mosquitto/secrets/passwd

persistence true
persistence_location /mosquitto/data/

# Log to the container's stdout — picked up by journalctl/podman logs,
# without needing yet another volume just for a log file.
log_dest stdout
