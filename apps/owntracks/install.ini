[config]
# Read by the app, never written by it: the destination is inside a volume,
# so it cannot be derived from the unit the way an .env can.
# Same as above: without it the broker accepts no connection from the
# other containers.
mosquitto.conf = %h/.config/containers/volumes/owntracks/mosquitto/config/mosquitto.conf
# Where the frontend looks for the recorder's API.
frontend-config.js = %h/.config/containers/volumes/owntracks/frontend-config.js

[login]
# The MQTT credential the phone app uses, not a web login.
user = owntracks
password = owntracks-mqtt-password

[secrets]
owntracks-mqtt-password = rand-base64 24
# A Mosquitto password file, not a loose value: it has to be produced by
# mosquitto_passwd with the SAME password as owntracks-mqtt-password.
owntracks-mosquitto-passwd = manual generate it with `mosquitto_passwd -c -b <file> owntracks <the-same-password>` (see the README)

[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
owntracks-mosquitto = registry
