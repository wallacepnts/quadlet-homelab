[choices]
# Asked once, at install time. The image downloads this OS on the first start
# and never looks at the value again — changing it later means wiping the
# volume. Alpine is the default here rather than upstream's `mint`: at 60 MB it
# proves the whole setup works in a minute instead of a coffee break.
BOOT =
    Which OS to install (downloaded on first boot)
    alpine: Alpine Linux — 60 MB, the quickest way to prove KVM works
    suse: openSUSE — 1.0 GB
    arch: Arch Linux — 1.2 GB
    zima: ZimaOS — 1.4 GB
    tails: Tails — 1.5 GB
    rocky: Rocky Linux — 2.1 GB
    alma: Alma Linux — 2.2 GB
    mx: MX Linux — 2.2 GB
    fedora: Fedora — 2.3 GB
    nixos: NixOS — 2.4 GB
    cachy: CachyOS — 2.6 GB
    mint: Linux Mint — 2.8 GB, upstream's own default
    ubuntus: Ubuntu Server — 3.0 GB
    debian: Debian — 3.3 GB
    gentoo: Gentoo — 3.6 GB
    slack: Slackware — 3.7 GB
    kali: Kali Linux — 3.8 GB
    zorin: Zorin OS — 3.8 GB
    xubuntu: Xubuntu — 4.0 GB
    manjaro: Manjaro — 4.1 GB
    kubuntu: Kubuntu — 4.4 GB
    ubuntu: Ubuntu Desktop — 6.0 GB
    centos: CentOS — 7.0 GB

[upstream]
# The Docker Hub user is `qemux` (with an x), the GitHub org is `qemus` (with
# an s). Without this line `updates.py` derives qemux/qemu and finds nothing.
qemu = qemus/qemu
