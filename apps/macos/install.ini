[choices]
# Asked once, at install time. The recovery image is downloaded on the first
# start and never looked at again — changing it later means wiping the volume.
VERSION =
    Which macOS to install (downloaded on first boot)
    15: macOS 15 Sequoia — upstream's default
    14: macOS 14 Sonoma
    13: macOS 13 Ventura
    12: macOS 12 Monterey
    11: macOS 11 Big Sur
    26: macOS 26 Tahoe — upstream advises against it, runs very slowly

[upstream]
# The image is `dockurr/macos` (two r's), the repository is `dockur/macos`.
# Without this line `updates.py` guesses the image name and finds nothing.
macos = dockur/macos
