[config]
# Both live in config/ INSIDE the recipes folder — cookcli looks there first
# and then in ~/.config/cook/. Since the volume is the /recipes directory,
# the destination cannot be derived from the unit.
aisle.conf.example = %h/.config/containers/volumes/cookcli/recipes/config/aisle.conf
pantry.conf.example = %h/.config/containers/volumes/cookcli/recipes/config/pantry.conf
# Reference recipes: installing gives you something to copy as a model, and
# the one in molhos/ exists to demonstrate references between recipes.
bolo-de-cenoura.cook.example = %h/.config/containers/volumes/cookcli/recipes/bolo-de-cenoura.cook
calda-de-chocolate.cook.example = %h/.config/containers/volumes/cookcli/recipes/molhos/calda-de-chocolate.cook
semana.menu.example = %h/.config/containers/volumes/cookcli/recipes/semana.menu
