[secrets]
# Basic-auth password of the web GUI and the remote-control API, read from
# RCLONE_RC_PASS. rcd refuses to start without one.
rclone-password = rand-alnum 24

[login]
user = admin
password = rclone-password

[upstream]
rclone = rclone/rclone

[image]
rclone = {version}

[store]
license = MIT. The web GUI is
docs = https://rclone.org/rc/
group = Files
