[secrets]
# The master key every API call carries in `X-Api-Key`. Set here so the key is
# deterministic; left empty, OpenWA generates one at first boot and only shows
# it in the startup banner and data/.api-key.
openwa-master-key = rand-urlsafe 48
# Server-side pepper for hashing the API keys (HMAC-SHA256 instead of plain
# SHA-256). Changing it later invalidates every key already issued, so it is
# generated at install time rather than added afterwards.
openwa-key-pepper = rand-hex 32
