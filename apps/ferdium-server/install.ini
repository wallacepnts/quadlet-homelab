[upstream]
# ferdium/ferdium-server tags its versions but publishes no GitHub release, so
# the redirect trick finds nothing — the registry's tag list is the reference.
ferdium-server = registry:^[0-9]+\.[0-9]+\.[0-9]+$

[store]
license = MIT.
docs = https://github.com/ferdium/ferdium-server#readme
group = Personal
