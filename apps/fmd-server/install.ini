[secrets]
# Without it, anyone who can reach the server can register an account on it:
# FMD Server only checks the token when one is set. Measured — with the variable
# unset, a registration carrying a wrong token goes straight through.
fmd-server-registration-token = rand-urlsafe 32

[login]
# Printed at the end of the install, because the FMD app asks for it the first
# time it registers with this server. It is not a password to any account.
password = fmd-server-registration-token

[upstream]
# The project lives on GitLab, not GitHub, and so does its image. The registry
# is the source that knows; the pattern keeps the alpine variant this unit uses
# and drops `-debian`, `-distroless`, the bare version and the floating majors.
fmd-server = registry:^[0-9]+\.[0-9]+\.[0-9]+-alpine$
