[config]
# The scrape list. Prometheus refuses to start without it, and the path is
# inside a volume, so it cannot be derived from the unit.
config/prometheus.yml = %h/.config/containers/volumes/prometheus/config/prometheus.yml

[upstream]
# The image is `prom/prometheus`, the repository is `prometheus/prometheus`.
prometheus = prometheus/prometheus

[image]
prometheus = v{version}

[store]
license = Apache-2.0
docs = https://prometheus.io/docs/introduction/overview/
group = Monitoring
works_with = grafana
