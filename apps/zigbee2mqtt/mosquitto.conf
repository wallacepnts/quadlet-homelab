# Zigbee2MQTT's broker. Copy it to
# ~/.config/containers/volumes/zigbee2mqtt/mosquitto/config/mosquitto.conf
listener 1883

# No authentication, on purpose: the host's port 1884 sits on the LAN, and
# the two expected clients (zigbee2mqtt and Home Assistant) are on the same
# machine. To require a username and password, see the corresponding section
# in owntracks' README, which already does it with a podman secret.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
