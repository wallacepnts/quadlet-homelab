[config]
# Read by the app, never written by it: the destination is inside a volume,
# so it cannot be derived from the unit the way an .env can.
# The serial port, the MQTT address and the permit-join setting. The app
# refuses to start without it.
configuration.yaml = %h/.config/containers/volumes/zigbee2mqtt/data/configuration.yaml
# Mosquitto listens on nothing but localhost unless this says otherwise.
mosquitto.conf = %h/.config/containers/volumes/zigbee2mqtt/mosquitto/config/mosquitto.conf


[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
zigbee2mqtt-mosquitto = registry
