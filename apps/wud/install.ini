[secrets]
# WUD 9 removed anonymous access and fails fast at startup with no
# administrator. The username is fixed in the unit; only the password is a
# secret.
wud-admin-password = rand-alnum 20

[login]
user = admin
password = wud-admin-password

[image]
wud = {version}

[store]
license = MIT
docs = https://getwud.github.io/wud/
group = Monitoring
