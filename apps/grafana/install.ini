[secrets]
# The admin password. Without it Grafana starts on admin/admin and asks you to
# change it at the first login — which only helps if you get there first.
grafana-admin-password = rand-alnum 20

[login]
user = admin
password = grafana-admin-password

[image]
grafana = {version}

[store]
license = AGPL-3.0
docs = https://grafana.com/docs/grafana/latest/
group = Monitoring
works_with = prometheus
