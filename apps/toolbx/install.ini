[upstream]
# The official Toolbx images. None of them come from a GitHub release, so the
# registry's tag list is the reference. Arch has only `latest`, so it is pinned
# by digest and there is nothing to compare.
toolbx-arch = -

toolbx-rhel = registry
toolbx-ubuntu = registry
# `registry:latest`, not `registry`: Fedora numbers its prereleases too, and
# publishes the stable release, the branched one and rawhide side by side —
# `46` is byte-identical to `rawhide` and `45` says `Prerelease` inside. The
# highest number is therefore always the wrong answer; asking which tag
# `latest` resolves to is what names the released one.
toolbx-fedora = registry:latest
