[secrets]
paperless-ngx-secret-key = rand-base64 64

[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
paperless-ngx-broker = compose:paperless-ngx/paperless-ngx:docker/compose/docker-compose.sqlite-tika.yml
paperless-ngx-tika = compose:paperless-ngx/paperless-ngx:docker/compose/docker-compose.sqlite-tika.yml
paperless-ngx-gotenberg = compose:paperless-ngx/paperless-ngx:docker/compose/docker-compose.sqlite-tika.yml
