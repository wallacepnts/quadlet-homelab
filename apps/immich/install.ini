[secrets]
immich-db-password = rand-base64 24

[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
immich = immich-app/immich
immich-machine-learning = immich-app/immich
immich-postgres = compose:immich-app/immich:docker/docker-compose.yml
immich-redis = compose:immich-app/immich:docker/docker-compose.yml

[backup]
# Thumbnails, transcodes and the caches are regenerated by Immich's own jobs
# (Administration > Jobs); the originals, the database and the settings are not.
exclude =
    upload/thumbs
    upload/encoded-video
    ml-cache
    ml-dotcache
    redis

[image]
immich-machine-learning = v{version}
immich = v{version}

[store]
license = AGPL-3.0.
docs = https://immich.app
group = Media
