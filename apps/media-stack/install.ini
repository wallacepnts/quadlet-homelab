[config]
# The stack has two EnvironmentFile= entries, so the generic `.env.example`
# has to say which of the two it is. media-stack-gluetun.env.example matches
# on its own, because its name already lines up with the destination.
.env.example = %h/.config/containers/env/media-stack.env

[vars]
# The one path decision in this stack: the root the media lives under, read by
# every unit through Volume=${MEDIA_DATA_DIR}. It is a variable of the systemd
# --user manager, not of an .env, because Quadlet expands Volume= there (rule
# 19). The install asks for it when it is unset, with this one Enter away.
MEDIA_DATA_DIR = ~/data
