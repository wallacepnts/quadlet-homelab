[config]
# The stack has two EnvironmentFile= entries, so the generic `.env.example`
# has to say which of the two it is. media-stack-gluetun.env.example matches
# on its own, because its name already lines up with the destination.
.env.example = %h/.config/containers/env/media-stack.env

[vars]
# The one path decision in this stack: the root the media lives under, read by
# every unit through Volume=${MEDIA_DATA_DIR}. It is a variable of the systemd
# --user manager, not of an .env, because Quadlet expands Volume= there (rule
# 19). The install asks for it when it is unset, with this one Enter away.
MEDIA_DATA_DIR = ~/data

[upstream]
# The image is still published as qmcgaw/gluetun; the repository moved from
# qdm12/gluetun to passteque/gluetun, and the old name only redirects.
media-stack-gluetun = passteque/gluetun

[backup]
# Jellyfin rebuilds its cache (images, transcodes) on its own.
exclude =
    jellyfin/cache

[image]
media-stack-bazarr = {version}
media-stack-deluge = {version}
media-stack-dispatcharr = {version}
media-stack-downtify = {version}
media-stack-gluetun = v{version}
media-stack-jellyfin = {version:2}
media-stack-lidarr = {version}
media-stack-navidrome = {version}
media-stack-prowlarr = {version}
media-stack-radarr = {version}
media-stack-sabnzbd = version-{version}
media-stack-seerr = v{version}
media-stack-sonarr = {version}

[store]
group = Downloads
