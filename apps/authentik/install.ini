# This service's secret recipes, for ./install.py.
# Forms: rand-hex N | rand-base64 N | rand-urlsafe N | rand-alnum N
#         shell <command> | manual <instruction for the user>
[secrets]
authentik-postgres-password = rand-urlsafe 32
authentik-secret-key = rand-urlsafe 48

[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
authentik = goauthentik/authentik
authentik-worker = goauthentik/authentik
authentik-postgres = -
