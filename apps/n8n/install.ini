[secrets]
n8n-encryption-key = rand-hex 32

[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
n8n = n8n-io/n8n

[image]
n8n = {version}

[store]
docs = https://n8n.io
group = Automation
# Images the app store shows, hosted by the project itself (https only, at most 6).
screenshots =
    https://raw.githubusercontent.com/n8n-io/n8n/master/assets/n8n-screenshot-readme.png
