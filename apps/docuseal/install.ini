[upstream]
# The image is `docuseal/docuseal`, the repository is `docusealco/docuseal` —
# without this updates.py guesses the org from the image and finds nothing.
docuseal = docusealco/docuseal

[image]
docuseal = {version}

[store]
license = AGPL-3.0.
docs = https://www.docuseal.com/docs
group = Productivity
