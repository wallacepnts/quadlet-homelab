[config]
# Read by the app, never written by it: the destination is inside a volume, so
# it cannot be derived from the unit the way an .env can. Without it the runner
# exits at start with `open config file "/data/config.yaml": no such file or
# directory`, because the unit points CONFIG_FILE there.
config.yaml = %h/.config/containers/volumes/gitea-runner/data/config.yaml

[secrets]
# The registration token comes from Gitea, not from here: the admin panel
# (Site Administration -> Actions -> Runners -> Create new Runner) or
# `gitea actions generate-runner-token` inside the container. It is spent on
# the first registration; after that the runner uses the `.runner` file in its
# volume and the token is no longer read.
gitea-runner-token = manual the runner registration token from Gitea

[upstream]
# The project lives on gitea.com, not on GitHub: deriving `gitea/runner` from
# the image name points at a 404 and every run would answer "no published
# release". The registry is the only source that knows. The pattern keeps the
# plain releases and drops `-dind`, `-dind-rootless`, `latest` and `nightly` —
# this repository does not use the bundled-daemon flavours, which need
# --privileged.
gitea-runner = registry:^[0-9]+\.[0-9]+\.[0-9]+$
