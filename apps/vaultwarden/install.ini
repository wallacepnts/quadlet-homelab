[secrets]
# Vaultwarden expects the token's argon2 HASH, not the token in plain text.
vaultwarden-admin-token = manual generate it with `podman run --rm vaultwarden/server:alpine /vaultwarden hash` and paste the hash

[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
vaultwarden = dani-garcia/vaultwarden
