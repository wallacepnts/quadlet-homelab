
[upstream]
# The GitHub repo per unit, for when the image name does not give it away.
# `-` = no comparable release (an infra base image: it follows the app's own
# compose, rule 9).
memos = usememos/memos

[image]
memos = {version}

[store]
license = MIT
docs = https://www.usememos.com/docs
group = Productivity
# Images the app store shows, hosted by the project itself (https only, at most 6).
screenshots =
    https://raw.githubusercontent.com/usememos/.github/refs/heads/main/assets/previews/timeline-light.png
