[secrets]
# The first account, created at the first start from USER=admin:<password>.
# Without it the first visitor to the port registers as the administrator —
# and this administrator controls every container of your Podman.
casa-user = shell printf 'admin:%s' "$(openssl rand -hex 16)"

[login]
credentials = casa-user

[image]
casa = {version}

[store]
license = MIT
group = Tools
