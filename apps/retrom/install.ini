[upstream]
# The image is `retrom-service`, the repository is `retrom` — without this
# updates.py derives the wrong name and finds nothing.
retrom = JMBeresford/retrom

[backup]
# Embedded PostgreSQL: no online dump from outside the container.
mode = stop

[image]
retrom = {version}

[store]
license = GPL-3.0
docs = https://github.com/JMBeresford/retrom/wiki
group = Media
