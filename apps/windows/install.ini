[secrets]
# The password for the `Docker` account inside Windows, used for RDP on 3389.
# The image's default is the literal string `admin`; this replaces it. The web
# viewer on 8006 has no login of its own — see the README.
windows-password = rand-alnum 20

[choices]
# Asked once, at install time, and written into the .env. Both only matter on
# the FIRST start: the edition and its language are downloaded then and never
# looked at again. The first option of each is the default.
VERSION =
    Which Windows to install (downloaded on first boot)
    11: Windows 11 Pro — 7.9 GB
    11l: Windows 11 LTSC — 4.7 GB, no Store, long-term servicing
    11e: Windows 11 Enterprise — 6.6 GB
    10: Windows 10 Pro — 5.7 GB
    10l: Windows 10 LTSC — 4.6 GB
    10e: Windows 10 Enterprise — 5.2 GB
    2025: Windows Server 2025 — 7.6 GB
    2022: Windows Server 2022 — 6.0 GB
    2019: Windows Server 2019 — 5.3 GB
    2016: Windows Server 2016 — 6.5 GB
    tiny11: Tiny11 — 5.3 GB, trimmed community build
    core11: Tiny11 Core — 3.0 GB, the smallest Windows 11 here
    tiny10: Tiny10 — 3.6 GB
    8e: Windows 8.1 Enterprise — 3.7 GB
    7u: Windows 7 Ultimate — 3.1 GB
    vu: Windows Vista Ultimate — 3.0 GB
    xp: Windows XP Professional — 0.6 GB
    2k: Windows 2000 Professional — 0.4 GB
    reactos: ReactOS — 0.1 GB, not Windows, no licence needed

LANGUAGE =
    Installation language — any of the 33 upstream names is accepted, not just these
    English
    Portuguese: for pt-BR also set REGION and KEYBOARD in the .env
    Spanish
    French
    German
    Italian
    Japanese
    Chinese
    Russian

[upstream]
# The image is `dockurr/windows` (two r's), the repository is `dockur/windows`.
# Without this line `updates.py` guesses the image name and finds nothing.
windows = dockur/windows
