[config]
# Read, never written: homepage mounts /app/config read-only.
config/docker.yaml = %h/.config/containers/volumes/homepage/config/docker.yaml
config/settings.yaml = %h/.config/containers/volumes/homepage/config/settings.yaml
config/services.yaml = %h/.config/containers/volumes/homepage/config/services.yaml
config/bookmarks.yaml = %h/.config/containers/volumes/homepage/config/bookmarks.yaml
