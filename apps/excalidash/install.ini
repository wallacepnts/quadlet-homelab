[secrets]
# Signs the session token and the CSRF token. The backend generates its own and
# keeps it in the volume when unset, but then a restore onto another host logs
# everyone out — 32 bytes is the minimum it accepts.
excalidash-jwt-secret = rand-hex 32
excalidash-csrf-secret = rand-hex 32

[upstream]
# The images are `excalidash-backend` and `excalidash-frontend`, the repository
# is `ExcaliDash` — updates.py derives neither from the image name.
excalidash = ZimengXiong/ExcaliDash
excalidash-backend = ZimengXiong/ExcaliDash
