[config]
# The backup hook. It runs on the host, not in a container: a unit cannot stop
# itself from inside the container being stopped. Which units it may stop is
# `ZEROBYTE_HOOK_UNITS` in the .service — empty allows nothing.
#
# Installed, not started: it needs a token first, and enabling it is
# `systemctl --user enable --now zerobyte-backup-hook.service`.
backup-hook/zerobyte-backup-hook.py = %h/.local/bin/zerobyte-backup-hook.py
backup-hook/zerobyte-backup-hook.service = %h/.config/systemd/user/zerobyte-backup-hook.service

[secrets]
zerobyte-app-secret = rand-hex 32
