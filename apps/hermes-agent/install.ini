[login]
user = admin
password = hermes-agent-dashboard-password

[secrets]
# Bearer key for the OpenAI-compatible gateway on 8642. Minimum 8 characters.
hermes-agent-api-key = rand-urlsafe 32
# Basic-auth password for the dashboard on 9119. The username is in the .env.
hermes-agent-dashboard-password = rand-urlsafe 24
# Signs the dashboard session cookie; without it every restart logs you out.
hermes-agent-dashboard-secret = rand-hex 32

# The provider keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, TELEGRAM_BOT_TOKEN) are
# NOT here on purpose: they are yours, not generated, and `hermes setup` writes
# them into /opt/data on first run. See the README.
