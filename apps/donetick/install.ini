[config]
# The volume is the /config directory, so the file name cannot be derived
# from the unit — it has to be stated here.
selfhosted.yaml.example = %h/.config/containers/volumes/donetick/config/selfhosted.yaml

[image]
donetick = v{version}

[store]
license = AGPL-3.0
docs = https://donetick.com
group = Personal
